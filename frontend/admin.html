<!-- frontend/admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin • Sponsorship Management</title>
  <style>
    :root{--accent:#ff5a5f;--card:#fff;--muted:#6b7280;--bg:#f4f8fb}
    *{box-sizing:border-box}
    body{font-family:Poppins, sans-serif;margin:0;background:var(--bg);color:#111}
    header{background:linear-gradient(90deg,#156be4,#5ac5ff);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:1.1rem;margin:0}
    .wrap{max-width:1100px;margin:26px auto;padding:0 16px}
    .card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 6px 20px rgba(16,24,40,0.06)}
    .login-box{max-width:420px;margin:60px auto}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eefc;margin-bottom:10px}
    button{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
    .btn-primary{background:#ff5a5f;color:#fff}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px;border-bottom:1px solid #f1f5f9;text-align:left}
    th{background:#fff;color:#111}
    .actions button{margin-right:8px;padding:6px 10px;border-radius:6px}
    .accept{background:#16a34a;color:#fff;border:none}
    .reject{background:#dc2626;color:#fff;border:none}
    .del{background:#6b7280;color:#fff;border:none}
    .logout{background:#7acaff;color:#fff;border:none;margin-top:12px}
    .muted{color:var(--muted)}
    @media(max-width:800px){table,thead,tbody,tr,th,td{display:block}thead{display:none}td{border:none;padding:8px}}
  </style>
</head>
<body>
  <header>
    <h1>Admin Panel</h1>
    <div style="font-weight:600">Sponsorship Management</div>
  </header>

  <div class="wrap">
    <!-- LOGIN -->
    <div id="loginSection" class="card login-box">
      <h3 style="margin:0 0 10px 0">Admin Login</h3>
      <input id="username" placeholder="Username" />
      <input id="password" placeholder="Password" type="password" />
      <div style="display:flex;gap:8px">
        <button id="loginBtn" class="btn-primary">Login</button>
      </div>
      
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none">
      <div class="card">
        <h2 style="margin:0 0 10px 0">All Sponsorship Requests</h2>
        <table id="requestsTable">
          <thead>
            <tr><th>ID</th><th>Event</th><th>Sponsor</th><th>Message</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
        </table>
        <div style="text-align:right;margin-top:10px">
          <button id="logoutBtn" class="logout">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loginSection = document.getElementById('loginSection');
    const dashboard = document.getElementById('dashboard');

    async function loginAdmin(){
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if(!username || !password) return alert('Enter credentials');

      const res = await fetch('/api/admin/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ username, password })
      });
      const data = await res.json();
      if(data.success){
        loginSection.style.display='none';
        dashboard.style.display='block';
        loadRequests();
      } else {
        alert('Invalid credentials');
      }
    }

    document.getElementById('loginBtn').addEventListener('click', loginAdmin);
    document.getElementById('logoutBtn').addEventListener('click', ()=>{
      dashboard.style.display='none';
      loginSection.style.display='block';
    });

    async function loadRequests(){
      const res = await fetch('/api/requests');
      const rows = await res.json();
      const tbody = document.querySelector('#requestsTable tbody');
      if(!rows.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">No requests yet</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(r=>`
        <tr>
          <td>${r.id}</td>
          <td>${r.event_name || ''}</td>
          <td>${r.sponsor_name}</td>
          <td>${r.message}</td>
          <td>${r.status}</td>
          <td class="actions">
            <button class="accept" onclick="update(${r.id}, 'Accepted')">Accept</button>
            <button class="reject" onclick="update(${r.id}, 'Rejected')">Reject</button>
            <button class="del" onclick="del(${r.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function update(id,status){
      if(!confirm('Are you sure?')) return;
      await fetch('/api/requests/'+id, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status })
      });
      alert('Status updated');
      loadRequests();
    }

    async function del(id){
      if(!confirm('Delete this request?')) return;
      await fetch('/api/requests/'+id, { method:'DELETE' });
      alert('Deleted');
      loadRequests();
    }
  </script>
</body>
</html>
